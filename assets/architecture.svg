<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes flowRight {
      0% { transform: translateX(-8px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(8px); opacity: 0; }
    }
    @keyframes flowLeft {
      0% { transform: translateX(8px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(-8px); opacity: 0; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .box { animation: fadeIn 0.8s ease-out both; }
    .box-1 { animation-delay: 0s; }
    .box-2 { animation-delay: 0.3s; }
    .box-3 { animation-delay: 0.6s; }
    .dot-right { animation: flowRight 1.5s ease-in-out infinite; }
    .dot-left { animation: flowLeft 1.5s ease-in-out infinite; }
    .dot-d1 { animation-delay: 0s; }
    .dot-d2 { animation-delay: 0.5s; }
    .dot-d3 { animation-delay: 1s; }
    .label { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .sublabel { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #656d76; font-size: 12px; }
    .tech { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, monospace; fill: #656d76; font-size: 11px; }
    .conn-label { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; font-size: 11px; }
  </style>

  <!-- White background -->
  <rect width="800" height="420" fill="white" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" class="label" font-size="20" font-weight="700" fill="#24292f">Cardy Architecture</text>

  <!-- ── Mobile App Box ── -->
  <g class="box box-1">
    <rect x="40" y="70" width="200" height="290" rx="16" fill="#f0f7ff" stroke="#218bff" stroke-width="1.5"/>
    <!-- Phone outline -->
    <rect x="80" y="95" width="120" height="210" rx="20" fill="white" stroke="#218bff" stroke-width="1.2"/>
    <rect x="118" y="100" width="44" height="6" rx="3" fill="#218bff" opacity="0.3"/>
    <circle cx="140" cy="292" r="8" fill="none" stroke="#218bff" stroke-width="1" opacity="0.4"/>
    <!-- Screen content lines -->
    <rect x="96" y="118" width="88" height="8" rx="4" fill="#218bff" opacity="0.15"/>
    <rect x="96" y="134" width="60" height="6" rx="3" fill="#218bff" opacity="0.1"/>
    <!-- Card shapes on screen -->
    <rect x="96" y="152" width="88" height="28" rx="6" fill="#218bff" opacity="0.12"/>
    <rect x="96" y="186" width="88" height="28" rx="6" fill="#218bff" opacity="0.08"/>
    <rect x="96" y="220" width="88" height="28" rx="6" fill="#218bff" opacity="0.05"/>

    <text x="140" y="330" text-anchor="middle" class="label" font-size="15" font-weight="600">Mobile App</text>
    <text x="140" y="348" text-anchor="middle" class="tech">React Native + Expo</text>
  </g>

  <!-- ── API Box ── -->
  <g class="box box-2">
    <rect x="310" y="70" width="200" height="290" rx="16" fill="#f0fff4" stroke="#2da44e" stroke-width="1.5"/>
    <!-- Gear icon -->
    <g transform="translate(390, 130)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#2da44e" stroke-width="1.5" opacity="0.5"/>
      <circle cx="20" cy="20" r="6" fill="#2da44e" opacity="0.3"/>
      <line x1="20" y1="2" x2="20" y2="8" stroke="#2da44e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="20" y1="32" x2="20" y2="38" stroke="#2da44e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="2" y1="20" x2="8" y2="20" stroke="#2da44e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="32" y1="20" x2="38" y2="20" stroke="#2da44e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Controller labels -->
    <rect x="340" y="190" width="140" height="30" rx="8" fill="#2da44e" opacity="0.1"/>
    <text x="410" y="210" text-anchor="middle" class="sublabel" font-size="12" fill="#2da44e">AuthController</text>

    <rect x="340" y="228" width="140" height="30" rx="8" fill="#2da44e" opacity="0.1"/>
    <text x="410" y="248" text-anchor="middle" class="sublabel" font-size="12" fill="#2da44e">CardController</text>

    <!-- JWT badge -->
    <rect x="355" y="270" width="110" height="22" rx="11" fill="#2da44e" opacity="0.12"/>
    <text x="410" y="285" text-anchor="middle" class="tech" fill="#2da44e" font-size="10">JWT + BCrypt</text>

    <text x="410" y="330" text-anchor="middle" class="label" font-size="15" font-weight="600">REST API</text>
    <text x="410" y="348" text-anchor="middle" class="tech">.NET 10 + EF Core</text>
  </g>

  <!-- ── Database Box ── -->
  <g class="box box-3">
    <rect x="580" y="70" width="180" height="290" rx="16" fill="#fff8f0" stroke="#d4820c" stroke-width="1.5"/>
    <!-- Cylinder / DB icon -->
    <ellipse cx="670" cy="130" rx="40" ry="14" fill="#d4820c" opacity="0.1" stroke="#d4820c" stroke-width="1.2"/>
    <rect x="630" y="130" width="80" height="60" fill="#d4820c" opacity="0.06"/>
    <ellipse cx="670" cy="190" rx="40" ry="14" fill="none" stroke="#d4820c" stroke-width="1.2"/>
    <line x1="630" y1="130" x2="630" y2="190" stroke="#d4820c" stroke-width="1.2"/>
    <line x1="710" y1="130" x2="710" y2="190" stroke="#d4820c" stroke-width="1.2"/>
    <!-- Table rows -->
    <rect x="645" y="148" width="50" height="6" rx="3" fill="#d4820c" opacity="0.2"/>
    <rect x="645" y="160" width="50" height="6" rx="3" fill="#d4820c" opacity="0.15"/>
    <rect x="645" y="172" width="50" height="6" rx="3" fill="#d4820c" opacity="0.1"/>

    <!-- Table labels -->
    <rect x="610" y="220" width="120" height="26" rx="8" fill="#d4820c" opacity="0.1"/>
    <text x="670" y="238" text-anchor="middle" class="sublabel" font-size="12" fill="#9a6700">Users</text>

    <rect x="610" y="254" width="120" height="26" rx="8" fill="#d4820c" opacity="0.1"/>
    <text x="670" y="272" text-anchor="middle" class="sublabel" font-size="12" fill="#9a6700">Cards</text>

    <text x="670" y="330" text-anchor="middle" class="label" font-size="15" font-weight="600">Database</text>
    <text x="670" y="348" text-anchor="middle" class="tech">SQLite</text>
  </g>

  <!-- ── Connection: App → API ── -->
  <line x1="240" y1="200" x2="310" y2="200" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="240" y1="230" x2="310" y2="230" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Animated dots App → API -->
  <circle cx="275" cy="200" r="3" fill="#218bff" class="dot-right dot-d1"/>
  <circle cx="275" cy="200" r="3" fill="#218bff" class="dot-right dot-d2"/>
  <circle cx="275" cy="200" r="3" fill="#218bff" class="dot-right dot-d3"/>

  <!-- Animated dots API → App -->
  <circle cx="275" cy="230" r="3" fill="#2da44e" class="dot-left dot-d1"/>
  <circle cx="275" cy="230" r="3" fill="#2da44e" class="dot-left dot-d2"/>
  <circle cx="275" cy="230" r="3" fill="#2da44e" class="dot-left dot-d3"/>

  <text x="275" y="190" text-anchor="middle" class="conn-label">HTTP / REST</text>

  <!-- ── Connection: API → DB ── -->
  <line x1="510" y1="200" x2="580" y2="200" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="510" y1="230" x2="580" y2="230" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Animated dots API → DB -->
  <circle cx="545" cy="200" r="3" fill="#2da44e" class="dot-right dot-d1"/>
  <circle cx="545" cy="200" r="3" fill="#2da44e" class="dot-right dot-d2"/>
  <circle cx="545" cy="200" r="3" fill="#2da44e" class="dot-right dot-d3"/>

  <!-- Animated dots DB → API -->
  <circle cx="545" cy="230" r="3" fill="#d4820c" class="dot-left dot-d1"/>
  <circle cx="545" cy="230" r="3" fill="#d4820c" class="dot-left dot-d2"/>
  <circle cx="545" cy="230" r="3" fill="#d4820c" class="dot-left dot-d3"/>

  <text x="545" y="190" text-anchor="middle" class="conn-label">EF Core</text>

  <!-- Footer note -->
  <text x="400" y="400" text-anchor="middle" class="sublabel" font-size="11" fill="#8b949e">Secure token storage via Expo SecureStore | Barcode scanning for card capture</text>
</svg>